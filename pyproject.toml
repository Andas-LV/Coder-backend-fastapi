[project]
name = "coder-backend-fastapi"
version = "0.1.0"
description = "Coder backend (FastAPI)"
readme = "README.md"
authors = [
    { name = "Andas", email = "andassatybaldy@gmail.com" }
]
requires-python = ">=3.12.6"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "ollama>=0.6.3",
    "openai>=3.46.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "boto3>=1.43.126",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["migrations/versions"]

# CUDA build of PyTorch on Windows (the default PyPI wheel is CPU-only there).
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132", marker = "sys_platform == 'win32'" }
